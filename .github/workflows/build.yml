name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0

      - name: Prepare builds folder
        run: mkdir -p $GITHUB_WORKSPACE/builds

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson

          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds || true
          cp build/plugins.json $GITHUB_WORKSPACE/builds || true

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git init
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          git add .
          git commit -m "Build $GITHUB_SHA" || exit 0

          git branch -M builds
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/mcvo1705/CXXX.git
          git push -f origin builds
