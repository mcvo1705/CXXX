name: Build Sextb

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant Permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Find cs3
        run: find . -name "*.cs3"

      - uses: actions/upload-artifact@v4
        with:
          name: cs3
          path: |
            **/*.cs3
