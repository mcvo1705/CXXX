name: Build Sextb

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant Permission
        run: chmod +x gradlew

      - name: Build Plugin
        run: ./gradlew Sextb:make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sextb
          path: |
            **/*.cs3
