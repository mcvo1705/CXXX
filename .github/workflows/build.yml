name: Build Sextb

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant Permission
        run: chmod +x gradlew

      - name: Build Sextb Only
        run: ./gradlew :Sextb:make

      - name: Find cs3
        run: find . -name "*.cs3"

      - name: Upload cs3
        uses: actions/upload-artifact@v4
        with:
          name: Sextb
          path: |
            **/*.cs3
